<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaseGraph 案件圖譜</title>
  <style>
    :root { color-scheme: light; font: 16px system-ui, sans-serif; }
    body { margin: 0; background: #f5f1e8; color: #28231d; }
    main { box-sizing: border-box; max-width: 760px; margin: 8vh auto; padding: 28px; background: #fffdf8; border: 1px solid #d6c9b7; border-radius: 12px; box-shadow: 0 12px 30px #4b32151c; }
    h1 { margin-top: 0; }
    #status { padding: 12px; border-radius: 8px; background: #eee6d9; }
    #status.error, #status.port-occupied { color: #8d1f1f; background: #f8dfd8; }
    #settings-repair { color: #8d1f1f; font-weight: 700; }
    dl { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; overflow-wrap: anywhere; }
    dt { font-weight: 700; }
    dd { margin: 0; font-family: ui-monospace, monospace; }
    .actions { display: flex; gap: 10px; margin: 20px 0; }
    button { padding: 9px 14px; border: 1px solid #947a5e; border-radius: 7px; background: #fff; color: inherit; cursor: pointer; }
    button:hover { background: #f0e6d6; }
    button:disabled { opacity: .55; cursor: wait; }
    pre { max-height: 260px; overflow: auto; white-space: pre-wrap; background: #211d18; color: #eee4d5; padding: 12px; border-radius: 7px; }
  </style>
</head>
<body>
  <main>
    <h1>CaseGraph 案件圖譜</h1>
    <p id="status" role="status" aria-live="polite">正在取得服務狀態…</p>
    <p id="settings-repair" hidden>設定檔需要修復</p>
    <dl>
      <dt>目前專案資料夾</dt><dd id="project-folder">-</dd>
      <dt>DB 路徑</dt><dd id="db-path">-</dd>
      <dt>設定檔</dt><dd id="settings-path">-</dd>
      <dt>紀錄檔</dt><dd id="log-path">-</dd>
    </dl>
    <div class="actions">
      <button id="use-free-port" hidden>改用空閒埠（本次）</button>
      <button id="retry" hidden>重試</button>
    </div>
    <details id="logs">
      <summary>紀錄（最後 200 行）</summary>
      <pre id="log-lines"></pre>
    </details>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const status = byId('status');
    const useFreePort = byId('use-free-port');
    const retry = byId('retry');
    const logs = byId('logs');
    let busy = false;

    function render(value) {
      if (!value) return;
      status.textContent = value.message || value.status || '服務狀態未知';
      status.className = value.status || '';
      byId('settings-repair').hidden = !value.settingsNeedsRepair;
      byId('project-folder').textContent = value.activeProjectFolder || '-';
      byId('db-path').textContent = value.dbPath || '-';
      byId('settings-path').textContent = value.settingsPath || '-';
      byId('log-path').textContent = value.logPath || '-';
      byId('log-lines').textContent = (value.logs || []).join('\n');
      const failed = value.status === 'error' || value.status === 'port-occupied';
      useFreePort.hidden = value.status !== 'port-occupied';
      retry.hidden = !failed;
      logs.open = failed || Boolean(value.error) || Boolean(value.settingsNeedsRepair);
    }

    async function service(action) {
      if (busy) return;
      busy = true;
      useFreePort.disabled = true;
      retry.disabled = true;
      try { render(await window.caseGraph.service(action)); }
      catch (error) { status.textContent = error.message || String(error); status.className = 'error'; logs.open = true; }
      finally { busy = false; useFreePort.disabled = false; retry.disabled = false; }
    }

    useFreePort.addEventListener('click', () => service('useFreePort'));
    retry.addEventListener('click', () => service('restart'));
    window.caseGraph.onStateChanged(render);
    window.caseGraph.getState().then(render).catch(error => {
      status.textContent = error.message || String(error);
      status.className = 'error';
      logs.open = true;
    });
  </script>
</body>
</html>
