<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaseGraph 案件圖譜</title>
  <style>
    /* Same palette as the wall's cork theme (L3); this file:// page cannot read the wall's chosen theme. */
    :root { color-scheme: dark; --text: #fff0d5; --muted: #e7cfb0; --border: #d4b06a; --surface: #513820; --raised: #69482b; --input: #2d1f16; --accent: #d4b06a; --danger: #ffadb5; --ok: #8ff0b6; font: 14px/1.5 "Microsoft JhengHei UI", "Microsoft JhengHei", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #a8713f, #704625); color: var(--text); }
    main { box-sizing: border-box; max-width: 760px; margin: 0 auto; padding: 8vh 20px; }
    .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: 0 8px 18px #23100566; }
    h1 { margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
    .body { padding: 18px; }
    .card { padding: 14px; border: 1px solid var(--border); border-radius: 7px; }
    #status { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); }
    #status::before { content: ''; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #8ff0b638; }
    #status.error, #status.port-occupied { color: var(--text); }
    #status.error::before, #status.port-occupied::before { background: var(--danger); box-shadow: 0 0 0 3px #ffadb538; }
    #status.stopped::before { background: var(--muted); box-shadow: none; }
    #settings-repair { margin: 8px 0 0; color: var(--danger); font-weight: 700; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions:not(:has(button:not([hidden]))) { display: none; }
    button { min-height: 32px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--raised); color: var(--text); font: inherit; cursor: pointer; }
    button:hover { border-color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--input); font-weight: 700; }
    button:disabled { opacity: .55; cursor: wait; }
    dl { display: grid; grid-template-columns: 120px 1fr; gap: 5px 12px; margin: 16px 0 0; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12px; overflow-wrap: anywhere; }
    dt { color: var(--muted); }
    dd { margin: 0; font-family: ui-monospace, Consolas, monospace; }
    details { margin-top: 14px; font-size: 12px; }
    summary { color: var(--muted); cursor: pointer; }
    pre { max-height: 260px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; padding: 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--input); color: var(--text); }
  </style>
</head>
<body>
  <main><div class="panel">
    <h1>CaseGraph 案件圖譜｜服務狀態</h1>
    <div class="body">
    <div class="card">
      <p id="status" role="status" aria-live="polite">正在取得服務狀態…</p>
      <p id="settings-repair" hidden>設定檔需要修復</p>
      <div class="actions">
        <button id="use-free-port" class="primary" hidden>改用空閒埠（本次）</button>
        <button id="open-settings" hidden>開啟設定</button>
        <button id="retry" hidden>重試</button>
      </div>
    </div>
    <dl>
      <dt>目前專案資料夾</dt><dd id="project-folder">-</dd>
      <dt>DB 路徑</dt><dd id="db-path">-</dd>
      <dt>目前實際埠</dt><dd id="effective-port">-</dd>
      <dt>設定檔</dt><dd id="settings-path">-</dd>
      <dt>紀錄檔</dt><dd id="log-path">-</dd>
    </dl>
    <details id="logs">
      <summary>紀錄（最後 200 行）</summary>
      <pre id="log-lines"></pre>
    </details>
    </div>
  </div></main>
  <script>
    const byId = id => document.getElementById(id);
    const status = byId('status');
    const useFreePort = byId('use-free-port');
    const openSettings = byId('open-settings');
    const retry = byId('retry');
    const logs = byId('logs');
    let busy = false;

    function render(value) {
      if (!value) return;
      status.textContent = value.message || value.status || '服務狀態未知';
      status.className = value.status || '';
      byId('settings-repair').hidden = !value.settingsNeedsRepair;
      byId('project-folder').textContent = value.activeProjectFolder || '-';
      byId('db-path').textContent = value.dbPath || '-';
      byId('effective-port').textContent = value.effectivePort || '-';
      byId('settings-path').textContent = value.settingsPath || '-';
      byId('log-path').textContent = value.logPath || '-';
      byId('log-lines').textContent = (value.logs || []).join('\n');
      const failed = value.status === 'error' || value.status === 'port-occupied';
      useFreePort.hidden = value.status !== 'port-occupied';
      openSettings.hidden = value.status !== 'port-occupied' && !value.settingsNeedsRepair;
      retry.hidden = !failed;
      logs.open = failed || Boolean(value.error) || Boolean(value.settingsNeedsRepair);
    }

    async function service(action) {
      if (busy) return;
      busy = true;
      useFreePort.disabled = true;
      retry.disabled = true;
      try { render(await window.caseGraph.service(action)); }
      catch (error) { status.textContent = error.message || String(error); status.className = 'error'; logs.open = true; }
      finally { busy = false; useFreePort.disabled = false; retry.disabled = false; }
    }

    useFreePort.addEventListener('click', () => service('useFreePort'));
    openSettings.addEventListener('click', () => {
      openSettings.disabled = true;
      Promise.resolve(window.caseGraph.openSettings()).catch(error => {
        status.textContent = error.message || String(error);
        status.className = 'error';
        logs.open = true;
      }).finally(() => { openSettings.disabled = false; });
    });
    retry.addEventListener('click', () => service('restart'));
    window.caseGraph.onStateChanged(render);
    window.caseGraph.getState().then(render).catch(error => {
      status.textContent = error.message || String(error);
      status.className = 'error';
      logs.open = true;
    });
  </script>
</body>
</html>
